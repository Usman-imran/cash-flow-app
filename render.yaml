# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: cash-flow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Supabase "Session pooler" connection string (asked for when the Blueprint is created)
      - key: DATABASE_URL
        sync: false
      # Comma-separated frontend origins, e.g. http://localhost:3000,https://your-app.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Karachi
